<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<meta name="description" content="קלפי היסודות — משחק שילובים וקרבות קלפים בסגנון אלכימי.">
<title>קלפי היסודות · FusGame</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&display=swap">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070912'/%3E%3Cg fill='none' stroke='%23d4a24c' stroke-width='1.4'%3E%3Ccircle cx='16' cy='16' r='11'/%3E%3Ccircle cx='16' cy='16' r='7.5' opacity='.5'/%3E%3Cpolygon points='16,9 22,20 10,20'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <button class="brand" id="brandBtn" type="button" aria-label="חזרה למעבדה">
    <span class="brand-mark" id="brandMark" aria-hidden="true"></span>
    <span class="brand-text">
      <b>קלפי היסודות</b>
      <i>Opus Alchemicum</i>
    </span>
  </button>

  <div class="purse" role="status" aria-live="polite">
    <span class="purse-item" title="זהב">
      <span class="purse-icon" aria-hidden="true">◈</span>
      <span id="goldOut">0</span>
    </span>
    <span class="purse-item" title="קלפים שגילית">
      <span class="purse-icon" aria-hidden="true">◇</span>
      <span id="discOut">0</span>
    </span>
  </div>
</header>

<main id="screen" class="screen" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
  <button type="button" data-nav="lab"><span class="t-ico">⌬</span><span>מעבדה</span></button>
  <button type="button" data-nav="codex"><span class="t-ico">☰</span><span>קודקס</span></button>
  <button type="button" data-nav="deck"><span class="t-ico">▤</span><span>חפיסה</span></button>
  <button type="button" data-nav="map"><span class="t-ico">✦</span><span>מסע</span></button>
</nav>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="modalHost" class="modal-host" hidden></div>

<script type="module" src="js/main.js"></script>
<noscript>
  <p style="padding:2rem;color:#ece6d6;font-family:sans-serif">
    המשחק דורש JavaScript פעיל.
  </p>
</noscript>
</body>
</html>
