<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060B">
<meta name="description" content="Nexus Arena — משחק לוחמים, שילובים וקרבות קלפים אלכימיים.">
<meta name="application-name" content="Nexus Arena">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus Arena">
<meta name="mobile-web-app-capable" content="yes">
<title>Nexus Arena · זירת הלוחמים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&family=Poppins:wght@300;400;600;700;800&display=swap">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <button class="brand" id="brandBtn" type="button" aria-label="חזרה למעבדה">
    <span class="brand-mark" id="brandMark" aria-hidden="true"><img src="icons/favicon-32.png" alt=""></span>
    <span class="brand-text">
      <b>NEXUS ARENA</b>
      <i>זירת הלוחמים</i>
    </span>
  </button>

  <div class="purse" role="status" aria-live="polite">
    <span class="purse-item" title="זהב">
      <span class="purse-icon" aria-hidden="true">◈</span>
      <span id="goldOut">0</span>
    </span>
    <span class="purse-item" title="קלפים שגילית">
      <span class="purse-icon" aria-hidden="true">◇</span>
      <span id="discOut">0</span>
    </span>
  </div>
</header>

<main id="screen" class="screen" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
  <button type="button" data-nav="lab"><span class="t-ico">⌬</span><span>מעבדה</span></button>
  <button type="button" data-nav="codex"><span class="t-ico">☰</span><span>קודקס</span></button>
  <button type="button" data-nav="deck"><span class="t-ico">▤</span><span>חפיסה</span></button>
  <button type="button" data-nav="map"><span class="t-ico">✦</span><span>מסע</span></button>
</nav>

<div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
<div id="modalHost" class="modal-host" hidden></div>

<script type="module" src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
  }
</script>
<noscript>
  <p style="padding:2rem;color:#ece6d6;font-family:sans-serif">
    המשחק דורש JavaScript פעיל.
  </p>
</noscript>
</body>
</html>
